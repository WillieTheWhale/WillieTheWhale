name: Update profile card

on:
  schedule:
    - cron: "17 5 * * *"   # 00:17 EST / 01:17 EDT, just after the day rolls over in Chapel Hill
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild card
        run: python build.py running
      - name: Commit if changed
        run: |
          if git diff --quiet -- dark.svg light.svg; then
            echo "No change today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git commit -m "Update uptime"
          git push
